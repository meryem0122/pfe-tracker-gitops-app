variables:
  DOCKER_TLS_CERTDIR: "/certs"

  
stages:
  - test
  - build
  - scan
  - push
  - update-manifest

test:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npm test

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker save $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -o image.tar
  artifacts:
    paths:
      - image.tar

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --exit-code 1 --severity CRITICAL,HIGH

push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker load -i image.tar
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

update-manifest:
  stage: update-manifest
  image: alpine:latest
  script:
    - apk add --no-cache git
    - git clone https://gitlab-ci-token:${MANIFESTS_REPO_TOKEN}@gitlab.com/meryemelmansouri01/pfe-tracker-gitops-manifests.git
    - cd pfe-tracker-gitops-manifests
    - 'sed -i "s|image:.*|image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|" deployment.yaml'
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git commit -am "Update image to $CI_COMMIT_SHORT_SHA" || echo "Rien à committer"
    - git push origin main